name: ChangeAttest CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[attest]" -r requirements-dev.txt
      - name: Verify standalone CLI entry points
        run: |
          python -m changeattest --version
          changeattest --version
          python -m changeattest check --help
      - name: Expose Git's Unix tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH'
      - name: Run regression tests
        env:
          GIT_AUTHOR_NAME: ChangeAttest CI
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ChangeAttest CI
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: python -m pytest -q tests --junitxml=changeattest-tests.xml
      - name: Record executed test evidence
        run: |
          python -I -m changeattest junit-evidence --root . --junit changeattest-tests.xml --report changeattest-test-receipt.json
          python -I -m changeattest render --input changeattest-test-receipt.json --format sarif --output changeattest-tests.sarif
          python -I -m changeattest store --input changeattest-test-receipt.json --database changeattest-local-history.sqlite

  package-smoke:
    name: package-build-and-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Install the generated wheel
        run: |
          python -m pip install dist/*.whl
          python -m changeattest --version
          changeattest --version
          python -I -m changeattest gate --help
  
  docker-restricted-smoke:
    name: docker-restrictions-linux-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Install candidate CLI on disposable runner
        run: python -m pip install .
      - name: Pull tested Python interpreter image and resolve immutable digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.13-slim
          IMAGE="$(docker image inspect python:3.13-slim --format '{{index .RepoDigests 0}}')"
          case "$IMAGE" in
            *@sha256:*) ;;
            *) echo "::error::Unable to resolve image digest"; exit 1;;
          esac
          echo "SMOKE_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Verify isolated AST execution succeeds and fails correctly
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/changeattest-docker-fixture"
          mkdir -p "$fixture"
          git -C "$fixture" init -q
          echo 'value = 1' > "$fixture/check.py"
          git -C "$fixture" add check.py
          python -I -m changeattest tools \
            --root "$fixture" --adapter python-ast-stdlib \
            --docker-image "$SMOKE_IMAGE" \
            --report "$RUNNER_TEMP/docker-pass.json"
          python -c 'import json,os; x=json.load(open(os.environ["RUNNER_TEMP"]+"/docker-pass.json")); assert x["status"]=="passed"; assert x["results"][0]["execution_mode"]=="docker-restricted"'
          echo 'def broken(:' > "$fixture/check.py"
          if python -I -m changeattest tools \
            --root "$fixture" --adapter python-ast-stdlib \
            --docker-image "$SMOKE_IMAGE" \
            --report "$RUNNER_TEMP/docker-fail.json"; then
            echo "::error::Invalid Python source passed Docker validation"
            exit 1
          fi
          python -c 'import json,os; x=json.load(open(os.environ["RUNNER_TEMP"]+"/docker-fail.json")); assert x["status"]=="failed"; assert x["results"][0]["exit_code"]!=0'
