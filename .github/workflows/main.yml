name: ChangeAttest CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Verify standalone CLI entry points
        run: |
          python -m changeattest --version
          changeattest --version
          python -m changeattest check --help
      - name: Expose Git's Unix tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH'
      - name: Run regression tests
        env:
          GIT_AUTHOR_NAME: ChangeAttest CI
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ChangeAttest CI
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: python -m pytest -q tests
