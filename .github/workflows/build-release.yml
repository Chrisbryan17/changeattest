name: ChangeAttest package build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  wheel-and-sdist:
    name: build-release-distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Preserve build artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: changeattest-distributions
          path: dist/*
          if-no-files-found: error

  release-attestation:
    name: attest-tagged-distributions
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: wheel-and-sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release artifacts from the build job
        uses: actions/download-artifact@v4
        with:
          name: changeattest-distributions
          path: dist

      - name: Generate Sigstore-backed build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Verify every attested distribution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "::error::No artifacts downloaded for verification"
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-release.yml"
          done
