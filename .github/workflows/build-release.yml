name: ChangeAttest package build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  wheel-and-sdist:
    name: build-release-distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Check tagged distribution version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import configparser,os; c=configparser.ConfigParser(); c.read("setup.cfg"); expected="v"+c["metadata"]["version"]; actual=os.environ["GITHUB_REF_NAME"]; assert expected==actual,(expected,actual)'
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Preserve build artifacts for inspection
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: changeattest-distributions
          path: dist/*
          if-no-files-found: error

  release-attestation:
    name: attest-tagged-distributions
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: wheel-and-sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release artifacts from the build job
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: changeattest-distributions
          path: dist

      - name: Generate Sigstore-backed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-path: dist/*

      - name: Verify every attested distribution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "::error::No artifacts downloaded for verification"
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-release.yml"
          done
