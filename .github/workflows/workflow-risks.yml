name: ChangeAttest Workflow Risk Audit
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-risks:
    name: github-workflow-risks-advisory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed workflow definitions as untrusted data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Install scanner in read-only disposable runner
        run: python -m pip install .
      - name: Produce source-backed workflow findings
        shell: bash
        run: |
          set -euo pipefail
          python -I -m changeattest workflow-audit \
            --root . \
            --report "$RUNNER_TEMP/workflow-audit.json"
      - name: Attach advisory report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: changeattest-workflow-risk-report
          path: ${{ runner.temp }}/workflow-audit.json
          if-no-files-found: error
          retention-days: 7
