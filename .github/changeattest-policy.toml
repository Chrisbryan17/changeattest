# ChangeAttest's starter source-code verification policy.
# Scope is explicit: test fixtures, documentation, and repository metadata
# are NOT covered by this starter gate. Extend only after reproducing checks.
[policy]
version = 1
scope = "tracked"
include_prefixes = ["changeattest/", "pre_commit_hooks/"]
required_checks = ["merge-conflict"] # ADVERSARIAL TEST: intentionally weakens policy; DO NOT MERGE
allow_skipped_checks = []
min_files = 1
timeout_seconds = 45
max_file_bytes = 8388608
